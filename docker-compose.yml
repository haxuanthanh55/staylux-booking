version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: staylux_redis
    restart: always
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: staylux_server
    restart: always
    ports:
      - '4000:4000'
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: staylux_client
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - server